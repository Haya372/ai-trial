# This workflow is managed by gh actions-lock.

name: SAST
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SEMGREP_VERSION: "1.161.0"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Semgrep
        run: pipx install "semgrep==${SEMGREP_VERSION}"
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/golang \
            --config p/typescript \
            --config p/react \
            --metrics off \
            --error \
            --json-output semgrep.json \
            --text
      - name: Annotate findings
        if: failure()
        run: |
          jq -r '.results[] | "::error file=\(.path),line=\(.start.line),endLine=\(.end.line),title=\(.check_id)::\(.extra.message | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A"))"' semgrep.json
