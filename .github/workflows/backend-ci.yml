name: Backend CI
on:
  push:
    branches:
      - main
    paths:
      - apps/backend/**/*.go
      - apps/backend/**/*.sql
      - apps/backend/go.mod
      - apps/backend/go.sum
      - apps/backend/.golangci.yml
      - apps/backend/Makefile
      - apps/backend/sqlc.yaml
      - .github/workflows/backend-ci.yml
  pull_request:
    paths:
      - apps/backend/**/*.go
      - apps/backend/**/*.sql
      - apps/backend/go.mod
      - apps/backend/go.sum
      - apps/backend/.golangci.yml
      - apps/backend/Makefile
      - apps/backend/sqlc.yaml
      - .github/workflows/backend-ci.yml

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/backend/go.mod
          cache: false
      - uses: jdx/mise-action@13afe6c5e6e99289dcc96c6bf5b67e50f5de4d5a # v2.2.3
        with:
          install: true
      - name: Generate sqlc code
        run: make sqlc-generate
        working-directory: apps/backend
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: apps/backend
          version: v2.13.2

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/backend/go.mod
      - uses: jdx/mise-action@13afe6c5e6e99289dcc96c6bf5b67e50f5de4d5a # v2.2.3
        with:
          install: true
      - name: Generate sqlc code
        run: make sqlc-generate
        working-directory: apps/backend
      - name: Run tests with coverage
        run: go test -coverprofile=coverage.out ./...
        working-directory: apps/backend
      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: apps/backend/coverage.out
      - name: Coverage report
        uses: fgrosse/go-coverage-report@e432de98ee94a276e8f666d25bfd76347665f75b # v1.3.1
        continue-on-error: true
        with:
          coverage-artifact-name: go-coverage
          coverage-file-name: apps/backend/coverage.out
