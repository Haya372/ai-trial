# This workflow is managed by gh actions-lock.

name: Backend CI
on:
  push:
    branches:
      - main
    paths:
      - apps/backend/**/*.go
      - apps/backend/**/*.sql
      - apps/backend/go.mod
      - apps/backend/go.sum
      - apps/backend/.golangci.yml
      - apps/backend/Makefile
      - apps/backend/sqlc.yaml
      - packages/schema/**
      - .github/workflows/backend-ci.yml
  pull_request:
    paths:
      - apps/backend/**/*.go
      - apps/backend/**/*.sql
      - apps/backend/go.mod
      - apps/backend/go.sum
      - apps/backend/.golangci.yml
      - apps/backend/Makefile
      - apps/backend/sqlc.yaml
      - packages/schema/**
      - .github/workflows/backend-ci.yml

permissions:
  contents: read

jobs:
  generate:
    name: Generate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: apps/backend/go.mod
      - uses: jdx/mise-action@v5.0.1
        with:
          install: true
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "26"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle schema
        run: pnpm --filter @ai-trial/schema bundle
      - name: Cache sqlc generated files
        id: cache-sqlc
        uses: actions/cache@v6.1.0
        with:
          path: apps/backend/infrastructure/db/generated/
          key: sqlc-${{ hashFiles('apps/backend/**/*.sql', 'apps/backend/sqlc.yaml') }}
      - name: Generate sqlc code
        if: steps.cache-sqlc.outputs.cache-hit != 'true'
        run: make sqlc-generate
        working-directory: apps/backend
      - name: Cache oapi-codegen generated files
        id: cache-oapi
        uses: actions/cache@v6.1.0
        with:
          path: apps/backend/interface/api/generated/
          key: oapi-${{ hashFiles('packages/schema/openapi.yaml', 'packages/schema/oapi-codegen.yaml', 'packages/schema/paths/**', 'packages/schema/components/**') }}
      - name: Generate oapi-codegen code
        if: steps.cache-oapi.outputs.cache-hit != 'true'
        run: make oapi-codegen-generate
        working-directory: apps/backend
      - name: Cache mockery generated files
        id: cache-mockery
        uses: actions/cache@v6.1.0
        with:
          path: |
            apps/backend/domain/*/generated/
            apps/backend/infrastructure/db/mock/
          key: mockery-${{ hashFiles('apps/backend/go.sum', 'apps/backend/**/*repository*.go', 'apps/backend/**/tx_manager.go') }}
      - name: Generate mock code
        if: steps.cache-mockery.outputs.cache-hit != 'true'
        run: go generate ./...
        working-directory: apps/backend

  lint:
    name: Lint
    needs: [generate]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: apps/backend/go.mod
          cache: false
      - name: Restore sqlc generated files
        uses: actions/cache/restore@v6.1.0
        with:
          path: apps/backend/infrastructure/db/generated/
          key: sqlc-${{ hashFiles('apps/backend/**/*.sql', 'apps/backend/sqlc.yaml') }}
      - name: Restore oapi-codegen generated files
        uses: actions/cache/restore@v6.1.0
        with:
          path: apps/backend/interface/api/generated/
          key: oapi-${{ hashFiles('packages/schema/openapi.yaml', 'packages/schema/oapi-codegen.yaml', 'packages/schema/paths/**', 'packages/schema/components/**') }}
      - name: Restore mockery generated files
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            apps/backend/domain/*/generated/
            apps/backend/infrastructure/db/mock/
          key: mockery-${{ hashFiles('apps/backend/go.sum', 'apps/backend/**/*repository*.go', 'apps/backend/**/tx_manager.go') }}
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          working-directory: apps/backend
          version: v2.13.2

  test:
    name: Test
    needs: [generate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: apps/backend/go.mod
      - uses: jdx/mise-action@v5.0.1
        with:
          install: true
      - name: Restore sqlc generated files
        uses: actions/cache/restore@v6.1.0
        with:
          path: apps/backend/infrastructure/db/generated/
          key: sqlc-${{ hashFiles('apps/backend/**/*.sql', 'apps/backend/sqlc.yaml') }}
      - name: Restore oapi-codegen generated files
        uses: actions/cache/restore@v6.1.0
        with:
          path: apps/backend/interface/api/generated/
          key: oapi-${{ hashFiles('packages/schema/openapi.yaml', 'packages/schema/oapi-codegen.yaml', 'packages/schema/paths/**', 'packages/schema/components/**') }}
      - name: Restore mockery generated files
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            apps/backend/domain/*/generated/
            apps/backend/infrastructure/db/mock/
          key: mockery-${{ hashFiles('apps/backend/go.sum', 'apps/backend/**/*repository*.go', 'apps/backend/**/tx_manager.go') }}
      - name: Run tests with coverage
        run: make test-coverage TAGS=integration
        working-directory: apps/backend
      - name: Fix coverage paths for monorepo
        # go-coverage-report uses github.com/<repo>/<changed-file-path> as the lookup key.
        # Our module is at apps/backend/ so coverage paths use "backend/" but the action
        # expects "apps/backend/". This sed replaces the module path to match.
        run: sed -i 's|github.com/Haya372/ai-trial/backend/|github.com/Haya372/ai-trial/apps/backend/|g' apps/backend/coverage.out
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: go-coverage
          path: apps/backend/coverage.out
      - name: Coverage report
        uses: fgrosse/go-coverage-report@v1.5.0
        continue-on-error: true
        with:
          coverage-artifact-name: go-coverage
          coverage-file-name: coverage.out
