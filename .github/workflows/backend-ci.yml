name: Backend CI
on:
  push:
    branches:
      - main
    paths:
      - apps/backend/**/*.go
      - apps/backend/go.mod
      - apps/backend/go.sum
      - apps/backend/.golangci.yml
      - apps/backend/Makefile
      - .github/workflows/backend-ci.yml
  pull_request:
    paths:
      - apps/backend/**/*.go
      - apps/backend/go.mod
      - apps/backend/go.sum
      - apps/backend/.golangci.yml
      - apps/backend/Makefile
      - .github/workflows/backend-ci.yml

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/backend/go.mod
          cache: false
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6.5.2
        with:
          working-directory: apps/backend
          version: v2.13.2

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/backend/go.mod
      - name: Run tests with coverage
        run: go test -coverprofile=coverage.out ./...
        working-directory: apps/backend
      - name: Coverage report
        uses: fgrosse/go-coverage-report@8c1d1a09864211d258937b1b1a5b849f7e4f2682 # v1.2.0
        with:
          coverage-artifact-name: go-coverage
          coverage-file-name: apps/backend/coverage.out
