# This workflow is managed by gh actions-lock.

name: E2E CI
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  e2e:
    name: E2E
    # コスト抑制のため、run-e2e ラベルが付いたPRでのみ実行する
    if: contains(github.event.pull_request.labels.*.name, 'run-e2e')
    # ジョブ単位に置くのは、ラベル無しでスキップされる実行が進行中のE2Eを取り消さないようにするため
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_trial_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ai_trial_dev?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: apps/backend/go.mod
      - uses: jdx/mise-action@v5.1.1
        with:
          install: true
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle schema
        run: pnpm --filter @ai-trial/schema bundle
      - name: Generate backend code
        run: |
          make sqlc-generate
          make oapi-codegen-generate
        working-directory: apps/backend
      - name: Generate frontend code
        run: |
          pnpm generate:frontend
          pnpm generate:web
      - name: Build web
        run: pnpm --filter web build
      - name: Migrate database
        run: make migrate-up
        working-directory: apps/backend
      - name: Install Playwright browser
        run: pnpm --filter e2e exec playwright install --with-deps chromium
      - name: Run E2E tests
        run: pnpm --filter e2e test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7
