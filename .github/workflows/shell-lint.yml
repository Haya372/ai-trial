# This workflow is managed by gh actions-lock.

name: Lint shell scripts
# 対象ファイルは scripts/lint-shell.sh だけで定義する。
# pathsで絞り込むと定義が重複するため、すべてのPRで実行する。
on:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # mise.toml の他のツールを mise exec がインストールしないようにする
      MISE_EXEC_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.10
        with:
          install: true
          install_args: shellcheck
      - name: Test lint-shell.sh
        run: mise exec -- bash scripts/lint-shell.test.sh
      - name: Run shellcheck
        run: mise exec -- bash scripts/lint-shell.sh
