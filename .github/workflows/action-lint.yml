# This workflow is managed by gh actions-lock.

name: Lint GitHub Actions workflows
on:
  pull_request:
    paths:
      - .github/**.yml
      - .github/workflows/actions.lock

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1.76.0
      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@v0.6.4
        with:
          advanced-security: false

  verify-actions-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock
      - name: Verify actions.lock matches workflows
        run: gh actions-lock --no-fix
