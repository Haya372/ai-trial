name: Web CI
on:
  pull_request:
    paths:
      - apps/web/**
      - packages/schema/**
      - packages/ui/**
      - pnpm-lock.yaml
      - .github/workflows/web-ci.yml

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache frontend generated files
        id: cache-frontend
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/src/api/generated.ts
          key: frontend-gen-${{ hashFiles('packages/schema/**') }}
      - name: Generate TypeScript code
        if: steps.cache-frontend.outputs.cache-hit != 'true'
        run: pnpm --filter @ai-trial/schema generate:frontend
      - name: Lint (includes format check)
        run: pnpm lint
      - name: Build
        run: pnpm build
