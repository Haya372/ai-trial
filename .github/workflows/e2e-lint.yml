# This workflow is managed by gh actions-lock.

name: E2E Lint
on:
  pull_request:
    paths:
      - apps/e2e/**
      - pnpm-lock.yaml
      - biome.jsonc
      - .oxlintrc.jsonc
      - .github/workflows/e2e-lint.yml

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint (includes format check)
        run: pnpm --filter e2e lint
