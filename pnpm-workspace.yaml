packages:
  - "apps/*"
  - "packages/*"
catalog:
  react: "19.3.1"
  react-dom: "19.3.1"
  "@types/react": "19.3.0"
  "@types/react-dom": "19.3.0"
  "@biomejs/biome": "2.6.6"
  typescript: "7.0.2"
  oxlint: "1.92.0"
  npm-run-all2: "9.0.4"
allowBuilds:
  '@scarf/scarf': false
  core-js: true
  esbuild: true
  lefthook: true
  protobufjs: true
auditLevel: moderate
overrides:
  # GHSA-g3hv-75wg-m249: 依存元（ts-morph・typedoc・glob）が ^10 を要求したままのため強制する
  minimatch@10: 11.0.5
  # GHSA-3g3m-2fjr-6pw4: 依存元（@joshwooding/vite-plugin-react-docgen-typescript）が ^13 を要求したままのため強制する
  glob@13: 14.0.4
