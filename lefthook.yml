pre-push:
  piped: true
  jobs:
    - name: gitleaks
      run: bash scripts/gitleaks-pre-push.sh
      use_stdin: true
    - name: go-build-lint
      glob: "apps/backend/**/*.{go,sql,yaml}"
      root: "apps/backend"
      run: make sqlc-generate && make build && make lint

pre-commit:
  piped: true
  jobs:
    - name: format
      glob: "{apps/web,apps/e2e,packages/ui}/**/*.{ts,tsx,js,jsx,json,css}"
      run: ./apps/web/node_modules/.bin/biome format --write {staged_files}
      stage_fixed: true
    - name: schema-lint
      glob: "packages/schema/**/*.{yaml,yml}"
      run: mise exec -- pnpm --filter @ai-trial/schema lint
    - name: go-format
      glob: "apps/backend/**/*.go"
      root: "apps/backend"
      run: gofmt -w {staged_files} && go tool goimports -w {staged_files}
      stage_fixed: true
    - name: go-lint
      glob: "apps/backend/**/*.go"
      root: "apps/backend"
      run: mise exec -- golangci-lint run ./...
    - name: go-release-age
      glob: "apps/backend/go.{mod,sum}"
      run: bash scripts/check-go-release-age.sh
    - name: shell-lint
      run: mise exec -- bash scripts/lint-shell.sh
    - name: markdown-lint
      glob: "{**/*.md,*.md}"
      run: mise exec -- markdownlint-cli2 {staged_files}
