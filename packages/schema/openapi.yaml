openapi: "3.1.0"
info:
  title: AI Trial API
  version: "0.1.0"
paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      tags:
        - health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: ["ok"]
          example: "ok"
