post:
  operationId: createEventShare
  summary: Generate a share link for an event
  tags:
    - events
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/CreateEventShareRequest.yaml"
  responses:
    "201":
      description: Share link created
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/CreateEventShareResponse.yaml"
    "400":
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ValidationErrorResponse.yaml"
    "401":
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/UnauthorizedErrorResponse.yaml"
    "403":
      description: Event belongs to another user
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ForbiddenErrorResponse.yaml"
    "404":
      description: Event not found
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/NotFoundErrorResponse.yaml"
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/InternalErrorResponse.yaml"
