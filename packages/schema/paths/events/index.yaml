get:
  operationId: getEvents
  summary: List events overlapping a datetime range
  tags:
    - events
  parameters:
    - name: startAt
      in: query
      required: true
      schema:
        type: string
        format: date-time
      description: Start of the search range, inclusive (RFC 3339 in UTC, must end with "Z")
    - name: endAt
      in: query
      required: true
      schema:
        type: string
        format: date-time
      description: End of the search range, exclusive (RFC 3339 in UTC, must end with "Z"). Must be after startAt
    - name: tagId
      in: query
      required: false
      schema:
        type: string
        format: uuid
      description: >-
        If present, return only events the caller owns that have this tag.
        Subscribed events are not returned.
  responses:
    "200":
      description: List of events
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/EventsListResponse.yaml"
    "400":
      description: Invalid query parameters
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ValidationErrorResponse.yaml"
    "401":
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/UnauthorizedErrorResponse.yaml"
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/InternalErrorResponse.yaml"
post:
  operationId: createEvent
  summary: Create a new event
  tags:
    - events
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/CreateEventRequest.yaml"
  responses:
    "201":
      description: Event created successfully
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/EventResponse.yaml"
    "400":
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ValidationErrorResponse.yaml"
    "401":
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/UnauthorizedErrorResponse.yaml"
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/InternalErrorResponse.yaml"
