get:
  operationId: listTags
  summary: List the current user's tags in creation order
  tags:
    - tags
  responses:
    "200":
      description: List of tags
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/TagsListResponse.yaml"
    "401":
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/UnauthorizedErrorResponse.yaml"
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/InternalErrorResponse.yaml"
post:
  operationId: createTag
  summary: Create a new tag
  tags:
    - tags
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/CreateTagRequest.yaml"
  responses:
    "201":
      description: Tag created successfully
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/TagResponse.yaml"
    "400":
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ValidationErrorResponse.yaml"
    "401":
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/UnauthorizedErrorResponse.yaml"
    "409":
      description: >-
        A tag with the same name (case-insensitive) already exists, or the
        user already owns the maximum number of tags (50)
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/TagConflictErrorResponse.yaml"
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/InternalErrorResponse.yaml"
