post:
  operationId: login
  summary: Login with email and password
  tags:
    - auth
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/LoginRequest.yaml"
  responses:
    "200":
      description: Login successful
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/UserResponse.yaml"
    "400":
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ValidationErrorResponse.yaml"
    "401":
      description: Invalid credentials
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/UnauthorizedErrorResponse.yaml"
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/InternalErrorResponse.yaml"
