type: object
required:
  - title
  - startAt
  - endAt
properties:
  title:
    type: string
    minLength: 1
  description:
    type: ["string", "null"]
  startAt:
    type: string
    format: date-time
  endAt:
    type: string
    format: date-time
  location:
    type: ["string", "null"]
  url:
    type: ["string", "null"]
  tagIds:
    type: array
    maxItems: 5
    items:
      type: string
      format: uuid
    description: >-
      Tag IDs to attach in attachment order. Max 5, no duplicates, owner-only
      tags. Omitted means no tags.
