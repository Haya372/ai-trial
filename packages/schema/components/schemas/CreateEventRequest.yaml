type: object
required:
  - title
  - startAt
  - endAt
properties:
  title:
    type: string
    minLength: 1
  description:
    type: ["string", "null"]
  startAt:
    type: string
    format: date-time
  endAt:
    type: string
    format: date-time
  location:
    type: ["string", "null"]
  url:
    type: ["string", "null"]
