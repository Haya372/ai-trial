type: object
required:
  - field
  - code
  - message
properties:
  field:
    type: string
    example: "email"
  code:
    type: string
    enum:
      - REQUIRED
      - INVALID_FORMAT
      - TOO_SHORT
      - TOO_LONG
      - INVALID_CHARACTER
      - INSUFFICIENT_COMPLEXITY
      - INVALID_DATE_RANGE
      - TOO_MANY
      - DUPLICATED
      - NOT_FOUND
    example: "INVALID_FORMAT"
  message:
    type: string
    example: "Invalid email format"
