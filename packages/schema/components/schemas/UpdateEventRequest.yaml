type: object
required:
  - title
  - startAt
  - endAt
properties:
  title:
    type: string
  startAt:
    type: string
    format: date-time
    description: RFC 3339 in UTC, must end with "Z"
  endAt:
    type: string
    format: date-time
    description: RFC 3339 in UTC, must end with "Z"
  description:
    type: ["string", "null"]
  location:
    type: ["string", "null"]
  url:
    type: ["string", "null"]
  tagIds:
    type: array
    maxItems: 5
    items:
      type: string
      format: uuid
    description: >-
      Tag IDs to attach in attachment order. Max 5, no duplicates, owner-only
      tags. Omitted means existing tags are kept; empty array removes all tags.
  recurrence:
    oneOf:
      - $ref: "./RecurrenceSpec.yaml"
      - type: "null"
    description: >-
      Omitted keeps the current recurrence; null stops repeating; an object
      sets the recurrence (a change when it differs from the current rule).
  scope:
    type: string
    enum:
      - single
      - future
      - all
    description: >-
      Required when the event belongs to a series. A one-off event accepts
      only single or omission.
