type: object
required:
  - id
  - title
  - startAt
  - endAt
  - isSubscribed
properties:
  id:
    type: string
    format: uuid
  title:
    type: string
  description:
    type: ["string", "null"]
  startAt:
    type: string
    format: date-time
  endAt:
    type: string
    format: date-time
  location:
    type: ["string", "null"]
  url:
    type: ["string", "null"]
  isSubscribed:
    type: boolean
    description: >-
      True when this event was added to the calendar via a share link
      (EventSubscription) rather than created by the caller. Subscribed
      events are read-only (no edit/delete).
