[tools]
go            = "1.27.3"
gitleaks      = "8.30.1"
actionlint    = "1.7.12"
shellcheck    = "0.11.0"
zizmor        = "1.30.0"
golangci-lint = "2.15.0"
node          = "26.13.1"
"npm:pnpm"    = "12.3.4"
sqlc          = "1.31.1"
gomigrate     = "4.19.1"
gh            = "2.100.0"
"npm:markdownlint-cli2" = "0.23.3"
semgrep       = "1.161.0"

[env]
_.file = ".env.example"
DATABASE_URL = "postgres://{{env.DB_USER}}:{{env.DB_PASSWORD}}@{{env.DB_HOST}}:{{env.DB_PORT}}/{{env.DB_NAME}}?sslmode=disable"
TURBO_TELEMETRY_DISABLED = "1"
SEMGREP_ENABLE_VERSION_CHECK = "0"
SEMGREP_SEND_METRICS = "off"
# Claude Code's sandbox denies writes to ~/.semgrep, where Semgrep writes these by default.
SEMGREP_LOG_FILE = "{{ get_env(name='TMPDIR', default='/tmp') }}/semgrep.log"
SEMGREP_SETTINGS_FILE = "{{ get_env(name='TMPDIR', default='/tmp') }}/semgrep-settings.yml"

[tasks.git-clean]
run = "bash scripts/git-clean-branches.sh"
description = "Delete local branches whose remote is gone"

[tasks.go-release-age]
run = "bash scripts/check-go-release-age.sh"
description = "Fail if any Go module version is too new (default: 7 days, override via MIN_RELEASE_AGE_DAYS)"

[tasks.actions-lock-setup]
run = "gh extension install github/gh-actions-lock --pin v0.1.6 --force"
description = "Install (or pin to the CI version) the gh-actions-lock extension"
