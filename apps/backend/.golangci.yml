version: "2"

linters:
  default: all
  disable:
    - wsl
    - wsl_v5
    - wrapcheck
    - revive
    - noinlineerr
    - nilnil
    - ireturn
    - godox
    - gochecknoinits
    - gochecknoglobals
    - exhaustruct
    - paralleltest
    - varnamelen
    - funlen
    - depguard
    - nlreturn
    - mnd

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Haya372/ai-trial

issues:
  exclude-dirs:
    - vendor
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - maintidx
        - cyclop
        - gocognit
        - gocyclo
