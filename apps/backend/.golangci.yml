version: "2"

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - revive
  settings:
    revive:
      rules:
        - name: exported
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Haya372/ai-trial

issues:
  exclude-dirs:
    - vendor
