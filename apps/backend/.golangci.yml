version: "2"

linters:
  default: all
  disable:
    - wsl
    - wsl_v5
    - wrapcheck
    - revive
    - noinlineerr
    - nilnil
    - ireturn
    - godox
    - gochecknoinits
    - gochecknoglobals
    - exhaustruct
    - exhaustruct_v5
    - paralleltest
    - varnamelen
    - funlen
    - gomodguard
    - nlreturn
    - mnd
  settings:
    forbidigo:
      forbid:
        # forbidigo's default rule, kept because setting `forbid` replaces it.
        - pattern: ^(fmt\.Print(|f|ln)|print|println)$
        # The raw path can carry secrets such as share tokens (/shares/{token})
        # and has unbounded cardinality. Only interface/route may read it.
        - pattern: \.URL\.Path$
          msg: "Use route.Pattern(r) instead: the raw path can carry secrets such as share tokens."
        - pattern: \.RequestURI$
          msg: "Use route.Pattern(r) instead: the raw request URI can carry secrets such as share tokens."
    depguard:
      rules:
        # Clean Architecture: inner layers must not depend on outer layers.
        # Allowed direction: domain ← usecase ← interface ← infrastructure ← cmd
        domain-must-not-import-outer-layers:
          list-mode: lax
          files:
            - "**/domain/**"
          deny:
            - pkg: "github.com/Haya372/ai-trial/backend/usecase"
              desc: "domain must not import usecase. Define an interface in domain and implement it in usecase (Dependency Inversion)."
            - pkg: "github.com/Haya372/ai-trial/backend/interface"
              desc: "domain must not import interface. Move the logic to usecase or interface layer."
            - pkg: "github.com/Haya372/ai-trial/backend/infrastructure"
              desc: "domain must not import infrastructure. Define a repository interface in domain and implement it in infrastructure."
            - pkg: "github.com/Haya372/ai-trial/backend/cmd"
              desc: "domain must not import cmd. Allowed flow: domain ← cmd."
        usecase-must-not-import-outer-layers:
          list-mode: lax
          files:
            - "**/usecase/**"
          deny:
            - pkg: "github.com/Haya372/ai-trial/backend/interface"
              desc: "usecase must not import interface. Move the logic to interface layer."
            - pkg: "github.com/Haya372/ai-trial/backend/infrastructure"
              desc: "usecase must not import infrastructure. Define a repository/gateway interface in usecase and implement it in infrastructure."
            - pkg: "github.com/Haya372/ai-trial/backend/cmd"
              desc: "usecase must not import cmd. Allowed flow: usecase ← cmd."
        # Applied to non-test files only: integration tests legitimately import infrastructure.
        interface-must-not-import-infrastructure:
          list-mode: lax
          files:
            - "**/interface/**"
            - "!$test"
          deny:
            - pkg: "github.com/Haya372/ai-trial/backend/infrastructure"
              desc: "interface production code must not import infrastructure. Inject implementations via constructor or infrastructure/di container."
            - pkg: "github.com/Haya372/ai-trial/backend/cmd"
              desc: "interface must not import cmd. Allowed flow: interface ← cmd."
  exclusions:
    paths:
      - vendor
      - infrastructure/db/generated
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - maintidx
          - cyclop
          - gocognit
          - gocyclo
      # route.Pattern is the single place allowed to fall back to the raw path.
      - path: interface/route/
        text: "use of `.+\\.URL\\.Path` forbidden"
        linters:
          - forbidigo

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Haya372/ai-trial
